name: Publish npm packages

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.event.release.tag_name }}

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Set up release tools
        run: |
          npm install --global npm@11.19.1
          corepack enable
          corepack prepare pnpm@10.26.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: pnpm release:verify "${{ github.event.release.tag_name }}"

      - name: Verify packages
        run: |
          pnpm test
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm build

      - name: Pack public packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/every-qrcode-release"
          package_version="${RELEASE_TAG#v}"
          mkdir -p "$package_dir"
          pnpm --filter @every-qrcode/core pack --pack-destination "$package_dir"
          pnpm --filter @every-qrcode/renderer-webgpu pack --pack-destination "$package_dir"
          pnpm --filter @every-qrcode/react pack --pack-destination "$package_dir"
          pnpm --filter @every-qrcode/web-component pack --pack-destination "$package_dir"
          echo "PACKAGE_DIR=$package_dir" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"

      - name: Publish packages in dependency order
        run: |
          set -euo pipefail
          publish_package() {
            package_name="$1"
            archive="$2"
            if npm view "$package_name@$PACKAGE_VERSION" version >/dev/null 2>&1; then
              echo "$package_name@$PACKAGE_VERSION is already published; skipping."
              return
            fi
            npm publish "$archive" --access public --registry=https://registry.npmjs.org
          }
          publish_package \
            "@every-qrcode/core" \
            "$PACKAGE_DIR/every-qrcode-core-$PACKAGE_VERSION.tgz"
          publish_package \
            "@every-qrcode/renderer-webgpu" \
            "$PACKAGE_DIR/every-qrcode-renderer-webgpu-$PACKAGE_VERSION.tgz"
          publish_package \
            "@every-qrcode/react" \
            "$PACKAGE_DIR/every-qrcode-react-$PACKAGE_VERSION.tgz"
          publish_package \
            "@every-qrcode/web-component" \
            "$PACKAGE_DIR/every-qrcode-web-component-$PACKAGE_VERSION.tgz"
